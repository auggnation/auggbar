# auggbar for Noctalia - the auggbar-only pieces of the old Quickshell bar,
# rebuilt as Noctalia bar widgets. Everything else auggbar had (workspaces,
# weather, media, visualizer, network, audio, mic, bluetooth, battery,
# brightness, tray, power) is a built-in Noctalia widget.

id = "auggnation/auggbar"
name = "auggbar"
version = "1.0.0"
plugin_api = 42
author = "auggnation"
license = "MIT"
icon = "layout-navbar"
description = "auggbar's scoreboard, RunViking CPU runner, CachyOS updater, sound, calendar and display settings as Noctalia bar widgets and panels."
tags = ["bar", "sports", "scores", "cpu", "updates", "fun"]
dependencies = ["python", "pacman-contrib", "wlr-randr", "libgpiod", "v4l-utils", "wireplumber"]

# ── Scoreboard ────────────────────────────────────────────────────────────
# A service fetches ESPN scores (python backend in scoreboard/, config in
# ~/.config/auggment/scoreboard.json), downloads team logos, and rotates
# through your games. The widget and the board panel just watch its state.

[[service]]
id = "scores"
entry = "scores_service.luau"

[[widget]]
id = "scoreboard"
entry = "scoreboard_widget.luau"

  [widget.actions]
  middle = "none"

[[panel]]
id = "board"
entry = "board_panel.luau"
width = 440
height = "content"
max_height = 640
placement = "attached"
open_near_click = true

# ── RunViking ─────────────────────────────────────────────────────────────
# Inspired by RunCat for GNOME Shell (win0err): the viking runs faster the
# harder the CPU works.

[[widget]]
id = "viking"
entry = "viking_widget.luau"

  [[widget.setting]]
  key = "idle_threshold"
  type = "int"
  label_key = "settings.idle_threshold.label"
  description_key = "settings.idle_threshold.description"
  default = 0
  min = 0
  max = 100

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  default = "character"
  options = [
    { value = "character", label_key = "settings.display_mode.character" },
    { value = "percentage", label_key = "settings.display_mode.percentage" },
    { value = "both", label_key = "settings.display_mode.both" },
  ]

  [[widget.setting]]
  key = "invert_speed"
  type = "bool"
  label_key = "settings.invert_speed.label"
  default = false

  [[widget.setting]]
  key = "smooth_speed"
  type = "bool"
  label_key = "settings.smooth_speed.label"
  default = true

  [[widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  default = 20
  min = 12
  max = 40

  [[widget.setting]]
  key = "monitor_command"
  type = "string"
  label_key = "settings.monitor_command.label"
  description_key = "settings.monitor_command.description"
  default = "btop"

# ── Updater ───────────────────────────────────────────────────────────────
# Pending pacman updates (checkupdates). Hidden when the system is current.

[[widget]]
id = "updater"
entry = "updater_widget.luau"

  [[widget.setting]]
  key = "check_minutes"
  type = "int"
  label_key = "settings.check_minutes.label"
  default = 30
  min = 5
  max = 1440

  [[widget.setting]]
  key = "hide_when_current"
  type = "bool"
  label_key = "settings.hide_when_current.label"
  default = true

  [[widget.setting]]
  key = "update_command"
  type = "string"
  label_key = "settings.update_command.label"
  description_key = "settings.update_command.description"
  default = "sudo pacman -Syu"

# ── Microphone (Framework hardware switch aware) ─────────────────────────
[[widget]]
id = "mic"
entry = "mic_widget.luau"

# ── Display ───────────────────────────────────────────────────────────────
# Port of auggment-display for mangowm: resolution, refresh, scale, rotation,
# brightness per output via wlr-randr. Keep/revert after 15 s; kept layouts
# are saved to ~/.config/mango/cfg/monitors.conf.

[[widget]]
id = "display"
entry = "display_widget.luau"

[[panel]]
id = "displaypanel"
entry = "display_panel.luau"
width = 420
height = "content"
max_height = 520
placement = "attached"
open_near_click = true

# ── Sound ─────────────────────────────────────────────────────────────────
# Default output / input, volume + mute, per-app volume (wpctl via sound/audio.py).

[[widget]]
id = "sound"
entry = "sound_widget.luau"

[[panel]]
id = "soundpanel"
entry = "sound_panel.luau"
width = 380
height = "content"
max_height = 640
placement = "attached"
open_near_click = true

# ── Calendar ──────────────────────────────────────────────────────────────
# Month grid + day agenda. iCal/webcal feeds and Google Calendar (gcal/gcal.py).

[[widget]]
id = "calendar"
entry = "calendar_widget.luau"

[[panel]]
id = "calendarpanel"
entry = "calendar_panel.luau"
width = 420
height = "content"
max_height = 720
placement = "attached"
open_near_click = true

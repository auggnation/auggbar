# Noctalia plugin catalog. This repo doubles as a Noctalia plugin source:
#   noctalia msg plugins source add auggbar git https://github.com/auggnation/auggbar
#   noctalia msg plugins enable auggnation/auggbar

[[plugin]]
id           = "auggnation/auggbar"
name         = "auggbar"
version      = "1.0.0"
author       = "auggnation"
license      = "MIT"
icon         = "layout-navbar"
description  = "auggbar's scoreboard, RunViking CPU runner, CachyOS updater, sound, calendar and display settings as Noctalia bar widgets and panels."
deprecated   = false
plugin_api   = 42
tags         = ["bar", "sports", "scores", "cpu", "updates", "fun"]
dependencies = ["python", "pacman-contrib", "wlr-randr", "libgpiod", "v4l-utils", "wireplumber"]
